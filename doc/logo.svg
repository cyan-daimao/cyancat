<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="cyancat logo">
  <defs>
    <!-- 青色背景渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <!-- 圆柱体正面渐变 -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <!-- 圆柱体侧面阴影 -->
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方块 -->
  <rect width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

  <!-- 猫耳（置于顶盘之后，根部被顶盘遮挡，自然贴合） -->
  <path d="M88 96 L104 40 L132 92 Z" fill="#ecfeff"/>
  <path d="M124 92 L152 40 L168 96 Z" fill="#ecfeff"/>
  <path d="M98 90 L108 56 L124 88 Z" fill="#22d3ee"/>
  <path d="M132 88 L148 56 L158 90 Z" fill="#22d3ee"/>

  <!-- 圆柱体正面 + 底盘 -->
  <rect x="72" y="96" width="112" height="114" fill="url(#body)"/>
  <!-- 右侧暗面，营造圆柱体感 -->
  <path d="M148 96 L184 96 L184 210 L148 210 Z" fill="url(#side)" opacity="0.55"/>
  <!-- 底盘前弧 -->
  <path d="M72 210 A56 18 0 0 0 184 210 L184 210 L72 210 Z" fill="#0e7490" opacity="0.18"/>
  <ellipse cx="128" cy="210" rx="56" ry="18" fill="url(#side)" opacity="0.0"/>
  <!-- 中间盘片分隔线 -->
  <path d="M72 150 A56 18 0 0 0 184 150" fill="none" stroke="#0e7490" stroke-width="3" opacity="0.25"/>
  <path d="M72 178 A56 18 0 0 0 184 178" fill="none" stroke="#0e7490" stroke-width="3" opacity="0.18"/>

  <!-- 顶盘 -->
  <ellipse cx="128" cy="96" rx="56" ry="18" fill="#ffffff"/>
  <ellipse cx="128" cy="96" rx="56" ry="18" fill="none" stroke="#0891b2" stroke-width="2" opacity="0.25"/>

  <!-- 猫眼（杏仁形，竖瞳） -->
  <ellipse cx="108" cy="150" rx="7" ry="11" fill="#0e7490"/>
  <ellipse cx="148" cy="150" rx="7" ry="11" fill="#0e7490"/>
  <ellipse cx="108" cy="150" rx="2.4" ry="9" fill="#06b6d4"/>
  <ellipse cx="148" cy="150" rx="2.4" ry="9" fill="#06b6d4"/>
  <!-- 眼神高光 -->
  <circle cx="110.5" cy="146" r="1.8" fill="#ffffff"/>
  <circle cx="150.5" cy="146" r="1.8" fill="#ffffff"/>

  <!-- 鼻子 + 嘴（猫吻） -->
  <path d="M124 168 L132 168 L128 173 Z" fill="#0e7490"/>
  <path d="M128 173 Q124 180 119 178" fill="none" stroke="#0e7490" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M128 173 Q132 180 137 178" fill="none" stroke="#0e7490" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 胡须 -->
  <g stroke="#0e7490" stroke-width="1.8" stroke-linecap="round" opacity="0.55">
    <path d="M72 162 L100 164"/>
    <path d="M72 172 L100 171"/>
    <path d="M184 162 L156 164"/>
    <path d="M184 172 L156 171"/>
  </g>
</svg>
