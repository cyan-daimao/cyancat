  <!-- 图标 -->
  <use href="#mark" x="8" y="8" width="184" height="184"/>

  <!-- 字标 -->
  <text x="212" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
